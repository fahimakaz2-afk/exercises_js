<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
    <style>
        
            
        .card{
            display: flex;
            border: 2px solid black;
            width: 604px;
            justify-content: center;
            padding: 12px;
            margin: 3px 3px 3px 3px;
            background-color: rgb(87, 84, 84);
        }
        .image img{
            width: 200px;
            justify-content: center;
        }
        .text h1{
            
            font-size: 16.38px;
            font-weight: 700;
        }
        .text h1,p{
          font-family: Arial, sans-serif;
          padding: 15px 2px;
        }
        .text p{
            font-size: 14px;
            font-weight: 400;
        }

        .image{
            position: relative;
        }
        .image .capsule{
           position: absolute;
           bottom: 23px;
           right: 2px;
           z-index: 10;
           background: rgb(77, 76, 76);
           color: white;
           opacity: 0.9;
           border-radius: 4px;
           font-size: 13px;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
        
            <div class="image">
                <img src="https://i.ytimg.com/vi/tVzUXW6siu0/hqdefault.jpg?sqp=-oaymwEnCPYBEIoBSFryq4qpAxkIARUAAIhCGAHYAQHiAQoIGBACGAY4AUAB&rs=AOn4CLCKktmHuXV_macV6MoUwhKxwzXJ7w" alt="">
               
                <div class="capsule">31:06</div>
                
            </div>
            
            <div class="text"> 
                <h1>Introduction to Backend | Sigma Web Dev Video #2</h1>
                <p>CodeWithHarry. 727k views. 2 months ago</p>
            </div>

            
        </div>
    </div>
    <script src="card.js"></script>

</body>
</html>
